# 技术设计 §12.4 CI 门禁顺序（本 job 内按序执行）：
#   1  依赖安装（frozen lockfile）        -> Install dependencies with frozen lockfile
#   2  lint                               -> Lint
#   3  format check                       -> Format check
#   4  typecheck                          -> Typecheck
#   5  unit tests                         -> Unit tests
#   6  database migrations from empty DB  -> Migration file consistency
#                                            + Build PostgreSQL 18.6 + PGroonga test image
#                                            + Start PostgreSQL 18.6 test cluster
#                                            + Bootstrap database roles
#                                            + Bootstrap PGroonga extension
#                                            + Migrate empty database
#   7  integration tests                  -> Integration tests against real PostgreSQL
#                                            （含 §12.4 database role/privilege probes）
#   8  OpenAPI/client drift check         -> OpenAPI and client drift check
#   9  Route Registry/permission/response-schema completeness
#                                         -> Route Registry completeness check
#  10  web/api production build           -> Build
#  11  dependency boundary check          -> Dependency boundary check
#                                            + Frontend boundary check (dependency-cruiser)
#  12  permission matrix test             -> Permission matrix check
#  13  dependency/secret scan             -> Dependency audit / Secret scan
#
# 迁移 0003_search_pgroonga.sql 在缺少 PGroonga 时 fail closed，因此本 job 先用
# database/poc/search-pgroonga/Dockerfile.pgroonga-pg18.6 基于 digest 固定的
# postgres:18.6 构建探针镜像，再按 database/scripts/test-local.ps1 的同一顺序执行
# 000_roles.sql -> 020_pgroonga.sql -> 迁移 -> 集成测试。该探针镜像只用于 CI 与
# PoC，不是生产部署镜像，也不等于 §12.4 的 container image build 门禁；生产镜像
# 与其 digest 仍由部署纵切片按 ADR-017 定案。
#
# `pnpm test:search:db` 与 `pnpm test` 需要已初始化 PGroonga 且
# max_connections >= 150 的 PostgreSQL 18 实例，沿用 origin/main 的既定决定暂不
# 纳入本 workflow；待批准的搜索服务测试方案确定后必须按 §12.4 顺序插入。
#
# §12.4 中尚未落库、因此本 workflow 不执行也不声称通过的项：
#   - Playwright critical-path tests（阶段 0 E2E 尚未建立）
#   - container image build、Compose config render + exact-tag/digest format
#     + PostgreSQL 18 mount check、image scan（仓库尚无生产 Dockerfile/compose.yaml，
#     且 ADR-017 要求的 Nginx 1.30.x 补丁与镜像 digest 仍需人工定案）
# 上述项落地后必须在本文件按 §12.4 顺序插入，不得跳过。
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/*"

permissions:
  contents: read

env:
  POSTGRES_IMAGE: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
  PGROONGA_IMAGE: inpulse-ci-pgroonga-pg18.6:local
  POSTGRES_CONTAINER: inpulse-ci-pg

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Enable corepack pnpm
        run: corepack enable

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Migration file consistency
        run: pnpm db:migrations:check

      - name: Build PostgreSQL 18.6 + PGroonga test image
        # 基础镜像由 POSTGRES_IMAGE 的 digest 固定；PGroonga 与 libgroonga 的
        # Debian 包版本和 keyring SHA-256 在 Dockerfile 内固定。
        run: |
          docker build \
            --file database/poc/search-pgroonga/Dockerfile.pgroonga-pg18.6 \
            --build-arg POSTGRES_IMAGE="$POSTGRES_IMAGE" \
            --tag "$PGROONGA_IMAGE" \
            database/poc/search-pgroonga

      - name: Start PostgreSQL 18.6 test cluster
        run: |
          docker run -d --name "$POSTGRES_CONTAINER" \
            --env POSTGRES_USER=cluster_bootstrap \
            --env POSTGRES_DB=app \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:5432:5432 \
            "$PGROONGA_IMAGE" \
            -c max_connections=200
          for attempt in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready --host=127.0.0.1 --username=cluster_bootstrap --dbname=app >/dev/null 2>&1; then
              echo "PostgreSQL 18.6 accepts connections."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time." >&2
          docker logs "$POSTGRES_CONTAINER"
          exit 1

      - name: Verify PGroonga is available
        # PGroonga 随探针镜像提供，这里只确认扩展能被 PostgreSQL 18.6 识别，
        # 失败时立即阻断，避免把缺少扩展的环境误判成迁移缺陷。
        run: |
          docker exec "$POSTGRES_CONTAINER" \
            psql -X -At -v ON_ERROR_STOP=1 -U cluster_bootstrap -d app \
            -c "SELECT count(*)::INTEGER FROM pg_available_extensions WHERE name = 'pgroonga'" \
            | grep -qx 1

      - name: Bootstrap database roles
        # 只执行 000_roles.sql：010_passwords.sql 读取 /run/secrets/* 的五个独立
        # 密码文件，属于生产初始化，CI 使用 trust 认证，与 database/scripts/test-local.ps1 一致。
        run: |
          docker exec --interactive "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -U cluster_bootstrap -d app \
            < database/bootstrap/000_roles.sql

      - name: Bootstrap PGroonga extension
        # PGroonga 不是 trusted extension，只能由一次性 bootstrap 超级用户安装；
        # 020_pgroonga.sql 同时撤销业务角色的管理函数 EXECUTE，只保留 app_runtime
        # 查询与转义所需函数。必须在 000_roles.sql 之后、迁移之前执行。
        run: |
          docker exec --interactive "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -U cluster_bootstrap -d app \
            < database/bootstrap/020_pgroonga.sql

      - name: Migrate empty database
        env:
          NODE_ENV: test
          MIGRATION_DATABASE_URL: postgresql://app_migrator@127.0.0.1:5432/app
        run: pnpm db:migrate

      - name: Integration tests against real PostgreSQL
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://cluster_bootstrap@127.0.0.1:5432/app
        run: pnpm test:integration

      - name: OpenAPI and client drift check
        run: pnpm contract:drift

      - name: Route Registry completeness check
        run: pnpm contract:validate

      - name: Build
        run: pnpm build

      - name: Deploy compose config and image ref preflight gate
        # 仓库尚无生产镜像 digest，本节只证明 compose 可渲染、ref 预检会拒绝占位符；
        # 真实 *_IMAGE_REF 的 digest 绑定是发布期 gate（check:deploy），不在 CI 伪造。
        run: |
          docker compose --project-directory deploy -f deploy/compose.yaml \
            --env-file deploy/.env.deploy.example config --quiet
          if node scripts/check_deploy_refs.mjs --env deploy/.env.deploy.example; then
            echo "Expected placeholder *_IMAGE_REF to be rejected by preflight." >&2
            exit 1
          fi
          echo "Compose config renders; preflight correctly rejects placeholder image refs."

      - name: Dependency boundary check
        run: pnpm check:deps

      - name: Frontend boundary check
        run: pnpm check:frontend:boundaries

      - name: Permission matrix check
        run: pnpm permissions:check

      - name: Dependency audit
        run: pnpm deps:audit

      - name: Secret scan
        run: pnpm check:secrets

      - name: Documentation checks
        run: pnpm check:docs

      - name: Stop PostgreSQL test cluster
        if: always()
        run: docker rm --force "$POSTGRES_CONTAINER" || true
