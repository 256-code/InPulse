# 生产稳态 Compose 拓扑（对齐技术设计 v1.2.2 §11.2）。
#
# 本期范围：稳态拓扑结构、镜像 ref 格式、Secrets/挂载/健康检查声明；已具备
# 生产 API/Web/Migration/DB-bootstrap 四类镜像（deploy/docker/*.Dockerfile）。
# 本文件不包含尚未交付的 backup / audit-archive 运维服务（F-10.3）；这两个
# operations 服务与宿主 12 小时调度是生产上线门禁项，上线时才启用，上线前不
# 部署、不运行。
#
# 说明：
#   1. *_IMAGE_REF 必须由受信镜像仓库解析后写入签名发布清单；本文件只引用
#      变量，不伪造 digest。发布前用 `pnpm check:deploy --env <file>` 校验；
#      CI 用 deploy/.env.deploy.test 做格式与结构正例，用 .example 做拒绝占位符负例。
#   2. 环境变量名按当前代码实际读取为准：
#        - migrate 读 MIGRATION_DB_PASSWORD_FILE / MIGRATION_DB_USER
#        - api 读 RUNTIME_DB_PASSWORD_FILE / DB_USER
#      技术设计 §11.2 的泛化 `DB_PASSWORD_FILE` 与代码命名仍未统一，属于生产前
#      人工定案项；本拓扑按当前代码落地，不静默改写设计或代码。
#   3. /health/live 与 /health/ready 已实现，应用全局前缀为 /api/v1；
#      API 生产镜像内置 healthcheck.mjs，Web 生产镜像内置 Nginx 配置与 curl。
#   4. 设计提及的 AUDIT_DB_*（独立 audit_reader 连接）代码尚未读取，本次不挂载
#      对应 Secret；TOTP_KEK_* 已由代码读取，本次挂载对应 Secret。
#   5. 首次建库与角色/密码初始化由 database/bootstrap 和后续独立 compose.init 纵切片
#      负责，本文件不为生产准备登录密码；生产不得暴露 PostgreSQL/API 到公网。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: "${DB_IMAGE_REF}"
    user: postgres
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - pg_data:/var/lib/postgresql
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_runtime -d app"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]
    logging: *default-logging

  migrate:
    image: "${MIGRATE_IMAGE_REF}"
    user: "10001:10001"
    command: ["node", "dist/src/migrate.js"]
    read_only: true
    tmpfs: [/tmp:size=64m, noexec, nosuid, nodev]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      MIGRATION_DB_USER: app_migrator
      MIGRATION_DB_PASSWORD_FILE: /run/secrets/db_migrator_password
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - source: db_migrator_password
        target: /run/secrets/db_migrator_password
        uid: "10001"
        gid: "10001"
        mode: "0400"
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    restart: "no"
    logging: *default-logging

  api:
    image: "${API_IMAGE_REF}"
    user: "10001:10001"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=128m, noexec, nosuid, nodev]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: app_runtime
      RUNTIME_DB_PASSWORD_FILE: /run/secrets/db_runtime_password
      # 待定案：代码尚未读取审计只读连接与 TOTP KEK，以下按设计拓扑保留注释。
      # AUDIT_DB_HOST: db
      # AUDIT_DB_PORT: "5432"
      # AUDIT_DB_NAME: app
      # AUDIT_DB_USER: audit_reader
      # AUDIT_DB_PASSWORD_FILE: /run/secrets/db_audit_reader_password
      SESSION_HASH_KEY_VERSION: "${SESSION_HASH_KEY_VERSION}"
      SESSION_HASH_KEYRING_FILE: /run/secrets/session_hash_keyring
      IDEMPOTENCY_FINGERPRINT_KEY_VERSION: "${IDEMPOTENCY_FINGERPRINT_KEY_VERSION}"
      IDEMPOTENCY_FINGERPRINT_KEYRING_FILE: /run/secrets/idempotency_fingerprint_keyring
      AUDIT_HMAC_KEY_VERSION: "${AUDIT_HMAC_KEY_VERSION}"
      AUDIT_HMAC_KEYRING_FILE: /run/secrets/audit_hmac_keyring
      TOTP_KEK_VERSION: "${TOTP_KEK_VERSION}"
      TOTP_KEK_KEYRING_FILE: /run/secrets/totp_kek_keyring
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    secrets:
      - source: db_runtime_password
        target: /run/secrets/db_runtime_password
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: session_hash_keyring
        target: /run/secrets/session_hash_keyring
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: idempotency_fingerprint_keyring
        target: /run/secrets/idempotency_fingerprint_keyring
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: audit_hmac_keyring
        target: /run/secrets/audit_hmac_keyring
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: totp_kek_keyring
        target: /run/secrets/totp_kek_keyring
        uid: "10001"
        gid: "10001"
        mode: "0400"
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.5"
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      # 依赖 /health/live 与 /health/ready 契约（见文件顶部冲突说明 3），
      # app 镜像需内置 healthcheck.mjs。
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  web:
    image: "${WEB_IMAGE_REF}"
    user: "101:101"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
      - /var/cache/nginx:size=32m,nosuid,nodev
      - /var/run:size=8m,nosuid,nodev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      TLS_CERT_FILE: /run/secrets/tls_cert
      TLS_KEY_FILE: /run/secrets/tls_key
    secrets:
      - source: tls_cert
        target: /run/secrets/tls_cert
        uid: "101"
        gid: "101"
        mode: "0400"
      - source: tls_key
        target: /run/secrets/tls_key
        uid: "101"
        gid: "101"
        mode: "0400"
    networks: [edge, backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      # Web 生产镜像内置 curl；/health/live 由 Nginx 代理到 API。
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-o",
          "/dev/null",
          "http://127.0.0.1:8080/health/live",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

networks:
  backend:
    internal: true
  edge:

volumes:
  pg_data:

secrets:
  db_migrator_password:
    file: ./secrets/db_migrator_password
  db_runtime_password:
    file: ./secrets/db_runtime_password
  session_hash_keyring:
    file: ./secrets/session_hash_keyring
  idempotency_fingerprint_keyring:
    file: ./secrets/idempotency_fingerprint_keyring
  audit_hmac_keyring:
    file: ./secrets/audit_hmac_keyring
  totp_kek_keyring:
    file: ./secrets/totp_kek_keyring
  tls_cert:
    file: ./secrets/tls_cert.pem
  tls_key:
    file: ./secrets/tls_key.pem
